[package]
name = "dnstap"
version = "0.1.8"
description = "Dnstap protocol library for DNS query and response logging with Protocol Buffers and Frame Streams."
authors = ["Frank Denis <github@pureftpd.org>"]
keywords = ["dns", "dnstap", "logging", "protobuf", "framestream"]
readme = "README.md"
license = "ISC"
homepage = "https://github.com/jedisct1/rust-dnstap"
repository = "https://github.com/jedisct1/rust-dnstap"
categories = ["encoding", "network-programming", "value-formatting"]
edition = "2018"

[badges]
travis-ci = { repository = "jedisct1/rust-dnstap" }

[dependencies]
framestream = "0.2.5"
mio = "0.6"
protobuf = "3.7.2"

[build-dependencies]
protobuf-codegen = "3.7.2"

[profile.release]
lto = true
panic = "abort"
opt-level = 3
